name: Archive Chem LibreTexts (5 subjects)

on:
  workflow_dispatch:
    inputs:
      download_timeout:
        description: 'Job timeout (seconds)'
        required: false
        default: '3000'
      max_urls_per_run:
        description: 'Max URLs per run (0 = unlimited)'
        required: false
        default: '0'
  schedule:
    - cron: '*/10 * * * *'   # runs every 5 minutes

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    concurrency: archive-crawl   # ensures only one run at a time
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run archiver
        env:
          DOWNLOAD_TIMEOUT: ${{ github.event.inputs.download_timeout || '300' }}
          MAX_URLS_PER_RUN: ${{ github.event.inputs.max_urls_per_run || '0' }}
        run: python crawl.py
      - name: Final push
        if: always()
        run: git push origin HEAD:main
