name: Archive chem.libretexts.org

on:
  workflow_dispatch:
    inputs:
      download_timeout:
        description: 'Download timeout (seconds)'
        required: false
        default: '30'
      max_urls_per_run:
        description: 'Max URLs to process this run (0 = unlimited)'
        required: false
        default: '0'
  schedule:
    # every 6 hours – adjust as needed
    - cron: '0 */6 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    # prevent overlapping runs
    concurrency: archive-crawl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # so we can push commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run archiver
        env:
          DOWNLOAD_TIMEOUT: ${{ github.event.inputs.download_timeout || '30' }}
          MAX_URLS_PER_RUN: ${{ github.event.inputs.max_urls_per_run || '0' }}
        run: python crawl.py

      - name: Final push (safety)
        if: always()
        run: git push origin HEAD:main
