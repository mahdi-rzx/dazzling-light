name: 'Generate File Tree'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tree
        run: sudo apt-get install -y tree
      
      - name: Update README
        run: |
          # Generate tree and save to temp file
          tree -a --dirsfirst -I ".git|.github" --charset ascii > /tmp/tree.txt
          
          # Check if README exists
          if [ ! -f "README.md" ]; then
            echo "# Repository" > README.md
            echo "" >> README.md
            echo "<!-- TREE_START -->" >> README.md
            echo "<!-- TREE_END -->" >> README.md
          fi
          
          # Create new README with tree inserted using a different approach
          # Extract content before TREE_START
          sed -n '1,/<!-- TREE_START -->/p' README.md | sed '$d' > README.new.md
          
          # Add TREE_START marker and tree content
          echo "<!-- TREE_START -->" >> README.new.md
          echo "" >> README.new.md
          echo '```' >> README.new.md
          cat /tmp/tree.txt >> README.new.md
          echo '```' >> README.new.md
          echo "" >> README.new.md
          
          # Add content after TREE_END (if it exists)
          if grep -q "<!-- TREE_END -->" README.md; then
            sed -n '/<!-- TREE_END -->/,$p' README.md | tail -n +2 >> README.new.md
          else
            echo "<!-- TREE_END -->" >> README.new.md
          fi
          
          mv README.new.md README.md
          echo "✅ README updated"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update file tree $(date +'%Y-%m-%d')"
          git push
